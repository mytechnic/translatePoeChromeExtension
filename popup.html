<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Popup</title>
    <link rel="stylesheet" href="css/popup.css">
    <script src="scripts/jquery-3.7.1.min.js"></script>
    <script src="scripts/chrome_api.js"></script>
    <script src="scripts/common.js"></script>
    <script src="scripts/popup.js"></script>
</head>
<body>
<div class="body">
    <div class="head">
        스타빈 POE 번역기 v1.0
    </div>
    <div class="version">
        Dictionary Ver. <span id="version"></span>
    </div>
    <div class="controls addPage">
        <button name="addPage">[+] 웹페이지 번역</button>
    </div>
    <div class="controls addPath">
        <button name="addPath">[+] 현재 경로의 모든 웹페이지 번역</button>
    </div>
    <div class="controls delPage">
        <button name="delPage">[-] 웹페이지 번역 취소</button>
    </div>
    <div class="controls delPath">
        <button name="delPath">[-] 현재 경로의 모든 웹페이지 번역 취소</button>
    </div>
    <div class="controls delAll">
        <button name="delAll">[-] 모든 웹페이지 번역 취소</button>
    </div>
    <div class="foot">
        패스 오브 액자일 IGN: @스타빈
    </div>
</div>
</body>
</html>
