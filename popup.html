<!-- popup.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>스타빈 POE 번역기</title>
    <link rel="stylesheet" href="css/popup.css"/>
    <script src="scripts/common.js"></script>
    <script src="scripts/popup.js"></script>
</head>
<body>
<div class="body">
    <header class="head">스타빈 POE 번역기</header>
    <section class="version">사전 버전: <span id="version">-</span></section>

    <section class="controls">
        <button name="addPage" class="addPage">[+] 현재 웹페이지 번역</button>
        <button name="addPath" class="addPath">[+] 현재 경로 전체 번역</button>
        <button name="delPage" class="delPage">[-] 현재 웹페이지 번역 취소</button>
        <button name="delPath" class="delPath">[-] 현재 경로 전체 번역 취소</button>
        <button name="delAll" class="delAll">[-] 전체 초기화</button>
    </section>

    <section class="tab-menu">
        <button id="tab-page" class="tab active">📄 현재 페이지</button>
        <button id="tab-path" class="tab">🌐 전체 경로</button>
    </section>

    <section class="tab-content" id="content-page">
        <p>불러오는 중...</p>
    </section>
    <section class="tab-content hidden" id="content-path">
        <p>불러오는 중...</p>
    </section>

    <footer class="foot">패스 오브 액자일 IGN: <strong>@스타빈</strong></footer>
</div>
</body>
</html>
